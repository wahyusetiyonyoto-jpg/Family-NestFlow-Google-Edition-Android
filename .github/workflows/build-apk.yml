name: Build Family NestFlow Google Edition APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify project inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/familynestflow/googleedition/MainActivity.java
          test -f google-apps-script/Code.gs
          test -f google-apps-script/Index.html
          grep -q "const APP_VERSION = '4.0.1';" google-apps-script/Code.gs
          grep -q "Google Edition v4.0.1" google-apps-script/Index.html

      - name: Build installable debug APK
        run: gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=release/Family-NestFlow-Google-Edition-v4.0.1.apk
          cp "$APK" "$OUT"
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs "$OUT" | tee release/signature-verification.txt
          "$SDK_TOOLS/aapt" dump badging "$OUT" | tee release/apk-information.txt
          grep -q "package: name='com.familynestflow.googleedition' versionCode='401' versionName='4.0.1'" release/apk-information.txt
          sha256sum "$OUT" | tee release/Family-NestFlow-Google-Edition-v4.0.1.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Family-NestFlow-Google-Edition-v4.0.1-APK
          path: |
            release/Family-NestFlow-Google-Edition-v4.0.1.apk
            release/Family-NestFlow-Google-Edition-v4.0.1.apk.sha256
            release/apk-information.txt
            release/signature-verification.txt
          if-no-files-found: error
          retention-days: 30
