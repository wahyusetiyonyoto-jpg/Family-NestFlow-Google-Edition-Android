name: Build SiRinci V1.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "codex/sirinci-gmail-only" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/familynestflow/googleedition/MainActivity.java
          test -f docs/index.html
          test -f supabase/setup.sql
          grep -q "SiRinci" app/src/main/AndroidManifest.xml
          grep -q "mggnfkarjjsejdrocfva.supabase.co" docs/index.html
          grep -q "bootstrap_google_user" supabase/setup.sql

      - name: Build installable debug APK
        run: gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=release/SiRinci-v1.0.0.apk
          cp "$APK" "$OUT"
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs "$OUT" | tee release/signature-verification.txt
          "$SDK_TOOLS/aapt" dump badging "$OUT" | tee release/apk-information.txt
          grep -q "package: name='com.familynestflow.googleedition' versionCode='1' versionName='1.0.0'" release/apk-information.txt
          sha256sum "$OUT" | tee release/SiRinci-v1.0.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiRinci-V1.0-APK
          path: |
            release/SiRinci-v1.0.0.apk
            release/SiRinci-v1.0.0.apk.sha256
            release/apk-information.txt
            release/signature-verification.txt
          if-no-files-found: error
          retention-days: 30
